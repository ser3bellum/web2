scripts:
  buildCommand: npm install && npm run build
  runCommand: npm start

env:
  - variable: NEXT_PUBLIC_FIREBASE_WEBAPP_CONFIG
    secret: NEXT_PUBLIC_FIREBASE_WEBAPP_CONFIG

  - variable: NANGO_SECRET_KEY
    secret: NANGO_SECRET_KEY_PROD

  - variable: NANGO_ENV
    value: prod

  - variable: NANGO_SLACK_PROVIDER_CONFIG_KEY
    value: slack

  - variable: APP_BASE_URL
    value: https://web-prod--ser3bellum-v2.europe-west4.hosted.app

  - variable: NEXT_PUBLIC_NANGO_GOOGLE_ANALYTICS_PROVIDER_CONFIG_KEY
    value: google-analytics

  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: ser3bellum
    availability:
      - BUILD
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET